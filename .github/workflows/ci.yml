name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and build .NET backend
        run: dotnet build backend/DocumentUpload.Functions/DocumentUpload.Functions.csproj --configuration Release
      - name: Build React frontend
        run: npm install --prefix frontend && npm run build --prefix frontend
      - name: Run Python tests
        run: pip install -r tests/requirements.txt && pytest -q tests/test_generator.py
      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep
      - uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: |
            frontend/dist
            backend/DocumentUpload.Functions/bin/Release/net8.0
