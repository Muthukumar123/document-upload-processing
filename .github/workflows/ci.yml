name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep
      - uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: |
            frontend/dist
            api/dist
